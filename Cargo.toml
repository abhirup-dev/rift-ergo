[package]
name = "rift-ergo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5.16"
rift-client = { git = "https://github.com/acsandmann/rift.git", rev = "c33cf4a79323a91be48a93b7aefde0c83d6026be" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lints that find code and dependencies to delete. `dead_code` is already on by
# default and `make check` denies warnings, so anything here fails the build
# rather than accumulating. All are clean as of adding them; they exist to catch
# rot, not to flag a backlog. Declared here so they apply to every build, not
# only to `make check`'s command line.
[lints.rust]
unused_crate_dependencies = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.clippy]
redundant_clone = "warn"
needless_pass_by_value = "warn"
